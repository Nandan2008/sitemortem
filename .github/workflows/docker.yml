name: Build and publish container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.img.outputs.name }}:latest,${{ steps.img.outputs.name }}:${{ github.sha }}

      - name: Smoke test (server starts and Chromium audits the demo site)
        run: |
          docker run -d --name sm -p 8000:8000 -e SITEMEDIC_MODE=demo ${{ steps.img.outputs.name }}:latest
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/api/health
          curl -fsN -X POST -F mode=demo -F scripted=true http://127.0.0.1:8000/api/run --max-time 600 > run.txt
          grep -q '"type": "report"' run.txt
          grep -q '"type": "done"' run.txt
          docker logs sm | tail -20

      - name: Push
        run: |
          docker push ${{ steps.img.outputs.name }}:latest
          docker push ${{ steps.img.outputs.name }}:${{ github.sha }}
